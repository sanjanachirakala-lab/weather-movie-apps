<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Search movies and see ratings, posters and release dates.">
  <title>Movie Search App | Chirakala Sanjana</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">API Apps</a>
    <nav aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="weather.html">Weather</a></li>
        <li><a href="movies.html" class="active">Movies</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <h1>Movie Search App</h1>

    <form id="movie-form" class="search-form" role="search">
      <label for="movie-input" class="sr-only">Movie title</label>
      <input id="movie-input" type="text" placeholder="Search a movie, e.g. Inception" autocomplete="off" required>
      <button type="submit" class="btn">Search</button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite">Search for a movie to get started.</p>

    <section id="movie-results" class="movie-grid" aria-label="Search results"></section>
  </main>

  <!-- Details dialog -->
  <dialog id="movie-dialog" class="movie-dialog" aria-labelledby="dialog-title">
    <button id="dialog-close" class="dialog-close" aria-label="Close details">&times;</button>
    <div id="dialog-body"></div>
  </dialog>

  <footer class="site-footer">
    <p>Data from <a href="https://www.omdbapi.com/" target="_blank" rel="noopener">OMDb API</a>.</p>
  </footer>

  <script type="module" src="js/movies.js"></script>
</body>
</html>
